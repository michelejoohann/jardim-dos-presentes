<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 950" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wildGoldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b89352" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#cfab69" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9e7938" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="petalTintRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e8cc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="leafTintRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9e6d5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8fa88a" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <g stroke="url(#wildGoldRight)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Haste Principal Cascata do Canto Superior Direito -->
    <path d="M 395 -10 C 330 60, 270 170, 290 300 C 310 430, 240 570, 275 700 C 300 790, 340 860, 395 920" stroke-width="2.2" />
    <path d="M 390 -5 C 325 65, 265 175, 285 305 C 305 435, 235 575, 270 705 C 295 795, 335 865, 390 925" stroke-width="0.8" stroke-dasharray="6 5" opacity="0.65" />

    <!-- 🌸 Flor Silvestre 1: Campânula / Flor de Sino Pendente no Topo (y=120) -->
    <g transform="translate(190, 110)">
      <path d="M 120 40 C 70 30, 20 15, -10 -15" stroke-width="1.5" />
      <!-- Campânula Silvestre 1 -->
      <path d="M -10 -15 C -25 -5, -35 15, -22 35 C -12 45, -2 40, -8 28 C -3 22, -3 2, -10 -15 Z" fill="url(#petalTintRight)" stroke-width="1.2" />
      <path d="M -22 35 C -17 44, -7 44, -2 40" stroke-width="1" />
      <path d="M -15 35 L -17 50 M -9 37 L -9 52" stroke-width="0.8" />

      <!-- Campânula Silvestre 2 (menor, ao lado) -->
      <path d="M 35 25 C 20 20, 10 35, 15 50 C 22 58, 30 55, 26 45 C 30 40, 30 28, 35 25 Z" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 15 50 C 18 56, 26 56, 30 54" stroke-width="0.9" />
      <path d="M 21 51 L 21 62" stroke-width="0.7" />

      <!-- Folhinha silvestre delicada -->
      <path d="M 60 22 C 45 -5, 15 -12, -5 -2 C 8 16, 35 24, 60 22 Z" fill="url(#leafTintRight)" stroke-width="1" />
    </g>

    <!-- 🌸 Flor Silvestre 2: Margarida do Campo Aberta (y=320) -->
    <g transform="translate(160, 310)">
      <path d="M 140 30 C 90 20, 40 5, 0 0" stroke-width="1.6" />
      <!-- Pétalas radiais silvestres -->
      <path d="M 0 0 C -10 -28, 6 -28, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 0 0 C 12 -24, 25 -14, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 0 0 C 28 -7, 28 9, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 0 0 C 24 14, 14 26, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 0 0 C 7 28, -9 28, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 0 0 C -14 24, -26 14, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 0 0 C -28 7, -28 -9, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <path d="M 0 0 C -24 -14, -14 -26, 0 0" fill="url(#petalTintRight)" stroke-width="1.1" />
      <!-- Miolo Dourado -->
      <circle cx="0" cy="0" r="7" fill="#e8cf92" fill-opacity="0.4" stroke-width="1.1" />
      <circle cx="0" cy="0" r="3.2" fill="#c59f5a" fill-opacity="0.5" stroke-width="0.8" />
    </g>

    <!-- Gavinha Espiral Delicada de Campo -->
    <path d="M 160 310 C 135 270, 110 255, 95 265 C 85 275, 95 290, 105 285" stroke-width="1" />

    <!-- 🌸 Flor Silvestre 3: Ramalhete de Flores de Campo Pequenas (y=510) -->
    <g transform="translate(180, 520)">
      <path d="M 85 30 C 50 15, 20 0, 0 0" stroke-width="1.5" />
      <!-- Flor 1 -->
      <g transform="translate(-15, -10)">
        <path d="M 0 0 C -12 -20, 12 -20, 0 0" fill="url(#petalTintRight)" stroke-width="1" />
        <path d="M 0 0 C 20 -12, 20 12, 0 0" fill="url(#petalTintRight)" stroke-width="1" />
        <path d="M 0 0 C 12 20, -12 20, 0 0" fill="url(#petalTintRight)" stroke-width="1" />
        <path d="M 0 0 C -20 12, -20 -12, 0 0" fill="url(#petalTintRight)" stroke-width="1" />
        <circle cx="0" cy="0" r="4.5" fill="#e8cf92" fill-opacity="0.5" stroke-width="0.8" />
      </g>
      <!-- Flor 2 menor -->
      <g transform="translate(-35, 18)">
        <path d="M 0 0 C -8 -15, 8 -15, 0 0" fill="url(#petalTintRight)" stroke-width="0.9" />
        <path d="M 0 0 C 15 -8, 15 8, 0 0" fill="url(#petalTintRight)" stroke-width="0.9" />
        <path d="M 0 0 C 8 15, -8 15, 0 0" fill="url(#petalTintRight)" stroke-width="0.9" />
        <path d="M 0 0 C -15 8, -15 -8, 0 0" fill="url(#petalTintRight)" stroke-width="0.9" />
        <circle cx="0" cy="0" r="3.5" fill="#e8cf92" fill-opacity="0.5" stroke-width="0.7" />
      </g>
    </g>

    <!-- Ramo Inferior com Folhas Silvestres (y=710) -->
    <path d="M 280 690 C 220 720, 160 705, 105 660" stroke-width="1.6" />
    <path d="M 165 710 C 135 740, 100 735, 85 705 C 115 690, 145 690, 165 710 Z" fill="url(#leafTintRight)" stroke-width="1.1" />
    <path d="M 105 660 C 80 685, 50 680, 35 655 C 65 640, 85 645, 105 660 Z" fill="url(#leafTintRight)" stroke-width="1.1" />
    <path d="M 105 660 L 40 648" stroke-width="0.8" />

    <!-- Botões no Ramo Inferior -->
    <circle cx="140" cy="740" r="4" fill="url(#petalTintRight)" stroke-width="0.9" />
    <circle cx="150" cy="733" r="3.5" fill="url(#petalTintRight)" stroke-width="0.8" />

    <!-- Folhinhas Soltas Flutuantes Silvestres -->
    <path d="M 230 40 C 215 60, 190 55, 185 35 C 205 25, 220 30, 230 40 Z" fill="url(#leafTintRight)" stroke-width="0.9" />
    <path d="M 310 200 C 295 220, 270 215, 265 195 C 285 185, 300 190, 310 200 Z" fill="url(#leafTintRight)" stroke-width="0.9" />
    <path d="M 215 840 C 200 860, 175 855, 170 835 C 190 825, 205 830, 215 840 Z" fill="url(#leafTintRight)" stroke-width="0.9" />
  </g>
</svg>
