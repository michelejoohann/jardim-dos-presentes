<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 950" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wildGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b89352" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#cfab69" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9e7938" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="petalTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8cc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="leafTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9e6d5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8fa88a" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <g stroke="url(#wildGold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Haste Principal Orgânica Curvada -->
    <path d="M -15 920 C 50 820, 95 700, 75 580 C 55 450, 115 320, 80 180 C 65 110, 30 50, -5 5" stroke-width="2.2" />
    <path d="M -10 925 C 55 825, 100 705, 80 585 C 60 455, 120 325, 85 185 C 70 115, 35 55, 0 10" stroke-width="0.8" stroke-dasharray="6 5" opacity="0.65" />

    <!-- 🌸 Flor Silvestre 1: Margarida do Campo / Chamomile no topo (y=160) -->
    <g transform="translate(140, 160)">
      <!-- Haste de suporte -->
      <path d="M -60 20 C -30 25, -10 15, 0 0" stroke-width="1.5" />
      <!-- Pétalas de Margarida Silvestre -->
      <path d="M 0 0 C -8 -30, 8 -30, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <path d="M 0 0 C 15 -25, 28 -15, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <path d="M 0 0 C 30 -8, 30 8, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <path d="M 0 0 C 25 15, 15 28, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <path d="M 0 0 C 8 30, -8 30, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <path d="M 0 0 C -15 25, -28 15, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <path d="M 0 0 C -30 8, -30 -8, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <path d="M 0 0 C -25 -15, -15 -28, 0 0" fill="url(#petalTint)" stroke-width="1.1" />
      <!-- Miolo da Margarida -->
      <circle cx="0" cy="0" r="7.5" fill="#e8cf92" fill-opacity="0.4" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3.5" fill="#c59f5a" fill-opacity="0.5" stroke-width="0.8" />
    </g>

    <!-- Botão de flor silvestre jovem -->
    <g transform="translate(195, 110)">
      <path d="M -55 50 C -30 30, -10 10, 0 0" stroke-width="1.2" />
      <path d="M 0 0 C -8 -16, 8 -16, 0 0" fill="url(#petalTint)" stroke-width="1" />
      <path d="M -4 2 C -10 -8, -2 -14, 0 0" stroke-width="0.8" />
      <path d="M 4 2 C 10 -8, 2 -14, 0 0" stroke-width="0.8" />
      <path d="M -5 6 C -8 10, -3 14, 0 6 C 3 14, 8 10, 5 6" fill="url(#leafTint)" stroke-width="0.8" />
    </g>

    <!-- Raminho com Folhas Serrilhadas Silvestres (y=280) -->
    <path d="M 95 310 C 150 280, 205 285, 260 310" stroke-width="1.6" />
    <!-- Folha Silvestre 1 -->
    <path d="M 180 292 C 190 260, 225 255, 245 280 C 220 295, 195 295, 180 292 Z" fill="url(#leafTint)" stroke-width="1.1" />
    <path d="M 180 292 L 240 280" stroke-width="0.7" />
    <path d="M 200 288 Q 208 275, 218 274" stroke-width="0.6" />
    <path d="M 215 285 Q 225 292, 235 290" stroke-width="0.6" />
    <!-- Folha Silvestre 2 -->
    <path d="M 220 298 C 245 275, 280 280, 295 305 C 265 320, 240 315, 220 298 Z" fill="url(#leafTint)" stroke-width="1.1" />
    <path d="M 220 298 L 290 305" stroke-width="0.7" />

    <!-- 🌸 Flor Silvestre 2: Rosa Silvestre / Silene Aberta no meio (y=450) -->
    <g transform="translate(170, 440)">
      <path d="M -90 10 C -50 20, -20 15, 0 0" stroke-width="1.6" />
      <!-- 5 Pétalas Delicadas Coroadas -->
      <path d="M 0 0 C -20 -35, -40 -15, -30 15 C -20 40, 0 30, 0 0" fill="url(#petalTint)" stroke-width="1.2" />
      <path d="M 0 0 C -12 -45, 22 -45, 30 -15 C 38 12, 18 30, 0 0" fill="url(#petalTint)" stroke-width="1.2" />
      <path d="M 0 0 C 25 -30, 52 -8, 42 22 C 32 50, 5 40, 0 0" fill="url(#petalTint)" stroke-width="1.2" />
      <path d="M 0 0 C 32 15, 28 50, -5 45 C -35 40, -22 15, 0 0" fill="url(#petalTint)" stroke-width="1.2" />
      <path d="M 0 0 C -32 22, -50 5, -35 -22 C -22 -40, -5 -20, 0 0" fill="url(#petalTint)" stroke-width="1.2" />
      <!-- Detalhes Centrais / Pistilo Silvestre -->
      <circle cx="0" cy="3" r="7" fill="#dfbe76" fill-opacity="0.45" stroke-width="1.1" />
      <path d="M -3 1 L -7 -3 M 0 -1 L 0 -7 M 3 1 L 7 -3 M 4 5 L 8 6 M -4 5 L -8 7" stroke-width="0.8" />
    </g>

    <!-- Gavinha Espiral Delicada de Vinha Silvestre -->
    <path d="M 230 460 C 265 480, 290 470, 295 450 C 300 430, 280 425, 275 438 C 270 450, 285 455, 290 450" stroke-width="1" />

    <!-- 🌸 Flor Silvestre 3: Flores Mínimas / Miosótis ou Campânulas (y=620) -->
    <g transform="translate(150, 620)">
      <path d="M -75 -15 C -40 -10, -10 5, 0 0" stroke-width="1.5" />
      <!-- Pequena Florzinha 1 -->
      <circle cx="20" cy="-15" r="5" fill="url(#petalTint)" stroke-width="1" />
      <circle cx="32" cy="-22" r="4.5" fill="url(#petalTint)" stroke-width="0.9" />
      <circle cx="42" cy="-14" r="5" fill="url(#petalTint)" stroke-width="1" />
      <circle cx="36" cy="-2" r="4.5" fill="url(#petalTint)" stroke-width="0.9" />
      <circle cx="23" cy="-4" r="5" fill="url(#petalTint)" stroke-width="1" />
      <circle cx="31" cy="-11" r="3" fill="#cfab69" stroke-width="0.7" />

      <!-- Folhas de suporte arredondadas -->
      <path d="M -10 5 C 10 25, 45 25, 55 5 C 35 -5, 10 0, -10 5 Z" fill="url(#leafTint)" stroke-width="1.1" />
      <path d="M -10 5 L 50 6" stroke-width="0.7" />
    </g>

    <!-- Ramo Inferior com Folhas de Amora Silvestre e Bagas (y=780) -->
    <path d="M 65 740 C 120 730, 180 755, 230 805" stroke-width="1.8" />
    <path d="M 230 805 C 260 775, 300 785, 320 825 C 280 835, 250 825, 230 805 Z" fill="url(#leafTint)" stroke-width="1.2" />
    <path d="M 230 805 L 315 823" stroke-width="0.8" />
    <path d="M 175 745 C 205 715, 245 720, 265 755 C 235 770, 200 765, 175 745 Z" fill="url(#leafTint)" stroke-width="1.2" />
    <path d="M 175 745 L 260 754" stroke-width="0.8" />
    <!-- Pequenas bagas silvestres -->
    <circle cx="215" cy="790" r="4.5" fill="url(#petalTint)" stroke-width="1" />
    <circle cx="226" cy="783" r="4" fill="url(#petalTint)" stroke-width="0.9" />
    <circle cx="233" cy="792" r="4.5" fill="url(#petalTint)" stroke-width="1" />

    <!-- Folhinhas Soltas Flutuantes Silvestres -->
    <path d="M 115 85 C 130 65, 155 70, 160 90 C 140 100, 125 95, 115 85 Z" fill="url(#leafTint)" stroke-width="0.9" />
    <path d="M 50 510 C 65 490, 90 495, 95 515 C 75 525, 60 520, 50 510 Z" fill="url(#leafTint)" stroke-width="0.9" />
    <path d="M 85 860 C 100 840, 125 845, 130 865 C 110 875, 95 870, 85 860 Z" fill="url(#leafTint)" stroke-width="0.9" />
  </g>
</svg>
